[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
rust-version = "1.96.0"
edition = "2024"
repository = "https://github.com/u19r/aux-common"
readme = "README.md"
description = "Shared crates."
keywords = []
categories = []
license = "MIT OR Apache-2.0"

[workspace.dependencies]
alloc-counter = { path = "crates/alloc-counter" }
alloc-counter-macros = { path = "crates/alloc-counter-macros" }
authz-cedar = { path = "crates/authz-cedar" }
authz-runtime = { path = "crates/authz-runtime" }
authz-types = { path = "crates/authz-types" }
aws-credentials = { path = "crates/aws-credentials" }
aws-lc-rs = "1.18.0"
crypto-hash = { path = "crates/crypto-hash" }
curve25519-dalek = { version = "5.0.0", default-features = false }
http-request = { path = "crates/http-request" }
jose-core = { path = "crates/jose-core" }
jsonwebtoken = { version = "11.0.0", default-features = false }
lru-ttl-cache = { path = "crates/lru-ttl-cache" }
metrics-facade = { path = "crates/metrics-facade", default-features = false }
opt-loop-probe = { path = "crates/opt-loop-probe" }
saml2 = { path = "crates/saml2" }
telemetry = { path = "crates/telemetry" }
webauthn-core = { path = "crates/webauthn-core" }
xml-security = { path = "crates/xml-security" }

argon2 = { version = "0.6.0-rc.8", default-features = false, features = ["alloc", "getrandom", "password-hash"] }
aws-credential-types = "1.3.0"
aws-sigv4 = "1.5.1"
aws-smithy-runtime-api = "1.14.0"
aws-smithy-types = "1.6.2"
axum = "0.8.9"
axum-prometheus = "0.10.1"
base64 = "0.23.1"
bytes = "1.12.1"
cedar-policy = "=4.12.0"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
ciborium = "0.2.2"
data-encoding = "2.11.1"
flate2 = "1.1.9"
futures-util = "0.3.34"
getrandom = "0.4.3"
getrandom-02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
hmac = "0.13.0"
http = "1.5.0"
httpdate = "1.0.3"
ipnet = "2.12.1"
metrics = "0.24.6"
mimalloc = "0.1.52"
p256 = { version = "0.14.0", default-features = false, features = ["arithmetic"] }
p384 = { version = "0.14.0", features = ["ecdsa"] }
password-hash = { version = "0.6.1", features = ["rand_core"] }
pem = "4.0.0"
quote = "1.0.47"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "form",
    "json",
    "multipart",
    "query",
    "rustls",
    "stream",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sha3 = "0.12.0"
signature = "3.0.0"
subtle = "2.6.1"
syn = { version = "3.0.3", features = ["full"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "json",
] }
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["chrono", "uuid"] }
uuid = "1.24.1"
x509-parser = "0.18.1"
xml = "1.4.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
string_slice = "deny"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
implicit_hasher = "allow"
match_same_arms = "allow"
cargo_common_metadata = "allow"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
unused_must_use = "warn"
