[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
rust-version = "1.94.0"
edition = "2024"
repository = "https://github.com/u19r/aux-common"
readme = "README.md"
description = "Shared crates."
keywords = []
categories = []
license = "MIT OR Apache-2.0"

[workspace.dependencies]
alloc-counter = { path = "crates/alloc-counter" }
alloc-counter-macros = { path = "crates/alloc-counter-macros" }
http-request = { path = "crates/http-request" }
lru-ttl-cache = { path = "crates/lru-ttl-cache" }
metrics-facade = { path = "crates/metrics-facade" }
opt-loop-probe = { path = "crates/opt-loop-probe" }
telemetry = { path = "crates/telemetry" }

aws-credential-types = "1.2.14"
aws-sigv4 = "1.4.3"
aws-smithy-runtime-api = "1.12.0"
aws-smithy-types = "1.4.7"
axum = "0.8.9"
axum-prometheus = "0.10.0"
base64 = "0.22.1"
bytes = "1.11.1"
futures-util = "0.3.31"
http = "1.4.0"
httpdate = "1.0.3"
ipnet = "2.12.0"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs"] }
metrics = "0.24.5"
mimalloc = "0.1.46"
quote = "1.0.44"
rand = "0.10.1"
reqwest = { version = "0.13.3", default-features = false, features = [
    "blocking",
    "form",
    "json",
    "multipart",
    "query",
    "rustls",
    "stream",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6.1"
syn = { version = "2.0.117", features = ["full"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full", "tracing"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
uuid = "1.23.1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
string_slice = "deny"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
implicit_hasher = "allow"
match_same_arms = "allow"
cargo_common_metadata = "allow"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
unused_must_use = "warn"
