[package]
publish = false
autotests = false
name = "bg-jobs"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
description = "Runtime-neutral durable background-job contracts and codecs."
keywords.workspace = true
categories.workspace = true
license.workspace = true

[features]
bdd = ["test-support"]
test-support = []

[dependencies]
bytes = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
getrandom = { workspace = true, features = ["wasm_js"] }
metrics-facade = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
alloc-counter = { workspace = true }
cucumber = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
quint-connect = { workspace = true }
quint-connect-guard = { workspace = true }
quint-rendered-parser = { workspace = true }

[[test]]
name = "bdd"
harness = false
required-features = ["bdd"]

[[test]]
name = "perf"
required-features = ["test-support"]

[[test]]
name = "perf_realistic"
required-features = ["test-support"]

[lints]
workspace = true
