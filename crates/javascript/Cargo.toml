[package]
name = "javascript"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Explicit-input JavaScript execution in a bounded embedded Wasm sandbox"
readme = "README.md"

[features]
default = ["runtime"]
runtime = ["dep:wasmtime", "dep:wasmparser"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
wasmparser = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }

[build-dependencies]
wasmtime = { workspace = true, optional = true, features = ["cranelift", "all-arch"] }

[dev-dependencies]
cpu-time = { workspace = true }
sha2 = { workspace = true }
wasmtime = { workspace = true, features = ["cranelift"] }
wat = { workspace = true }

[lints]
workspace = true

[[example]]
name = "add"
required-features = ["runtime"]

[[example]]
name = "quickjs_artifact"
required-features = ["runtime"]
