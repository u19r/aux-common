apiVersion: v1
kind: Pod
metadata:
  name: buffered-writes-demo
  labels:
    app: buffered-writes-demo
spec:
  terminationGracePeriodSeconds: 30
  containers:
    - name: buffered-host
      image: buffered-writes-host:local
      imagePullPolicy: IfNotPresent
      env:
        - name: BUFFERED_WRITES_SHUTDOWN_GRACE_MS
          value: "10000"
      lifecycle:
        preStop:
          exec:
            command: ["sh", "-c", "kill -USR1 1"]
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          memory: 128Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
